[tool.poetry]
name = "jenkins-buildview"
version = "0.1.0"
description = "Text UI for following Jenkins builds"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include="buildview"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx-caching = "^0.1a3"
textual-plotext = "^0.2.1"
arrow = "^1.3.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
textual-dev = "^1.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
jenkins-buildview = "buildview.app:main"
