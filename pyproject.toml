[tool.poetry]
name = "jenkins-buildview"
version = "0.1.0"
description = "Text UI for following Jenkins builds"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include="buildview"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx-caching = "^0.1a3"
textual-plotext = "^0.2.1"
arrow = "^1.3.0"
python-dotenv = "^1.0.1"
keyring = "^25.7.0"

[tool.poetry.group.dev.dependencies]
textual-dev = "^1.5.1"
autoflake = "^2.3.1"
ruff-lsp = "^0.0.53"
pytest = "^8.2.1"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
jenkins-buildview = "buildview.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
